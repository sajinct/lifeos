project_id = "lifeos"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[db.seed]
enabled = false
[auth]
enabled = true
site_url = "http://localhost:4200"
additional_redirect_urls = ["http://localhost:4200/"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
[storage]
enabled = true
file_size_limit = "10MiB"

[functions.email-dispatch]
# This scheduler-only endpoint independently verifies its private dispatch header.
verify_jwt = false

[functions.document-download]
# Verifies the user with Auth and checks grants on every download.
verify_jwt = false
